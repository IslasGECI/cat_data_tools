[project]
name = "cat-data-tools"
version = "1.6.0"
description = "..."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ciencia de Datos • GECI", email = "ciencia.datos@islas.org.mx" }
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy",
    "pandas",
    "typer[all]",
]

[project.urls]
Homepage = "https://github.com/IslasGECI/cat_data_tools"

[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project.scripts]
cat-data-tools = "cat_data_tools.cli:app"

[tool.flit.module]
name = "cat_data_tools"

[tool.mutmut]
paths_to_mutate = [ "cat_data_tools/" ]
tests_dir = [ "tests/" ]
